  <g fill="#4f8a32">
    <rect x="3" y="2" width="4" height="2"/>
    <rect x="9" y="2" width="4" height="2"/>
    <rect x="1" y="4" width="14" height="4"/>
    <rect x="3" y="8" width="10" height="2"/>
    <rect x="5" y="10" width="6" height="2"/>
    <rect x="7" y="12" width="2" height="2"/>
  </g>
